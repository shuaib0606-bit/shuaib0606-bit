name: Refresh profile graphics

on:
  schedule:
    - cron: "17 0 * * *"   # every day at 00:17 UTC
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Draw the skyline and stats from GitHub data
        run: python .github/scripts/build_profile.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
      - name: Commit the new graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          git diff --cached --quiet || (git commit -m "Refresh profile graphics" && git push)
